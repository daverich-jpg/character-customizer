const { useState, useEffect, useRef } = React;

function useMediaQuery(query) {
  const [match, setMatch] = useState(() =>
    typeof matchMedia === "function" ? matchMedia(query).matches : false);
  useEffect(() => {
    if (typeof matchMedia !== "function") return;
    const mq = matchMedia(query);
    const on = () => setMatch(mq.matches);
    on();
    mq.addEventListener ? mq.addEventListener("change", on) : mq.addListener(on);
    return () => (mq.removeEventListener ? mq.removeEventListener("change", on) : mq.removeListener(on));
  }, [query]);
  return match;
}

/* =========================================================
   Spring-animated body color.
   Real spring physics (same model Framer Motion uses: stiffness/damping/mass),
   interpolated in HSL so the in-between blend stays vivid rather than muddy.
   Progress is clamped to [0,1] so a hue can't visibly overshoot the target.
   ========================================================= */
/* =========================================================
   Shared animation config (read by every interaction). The DevPanel
   (?debug=true or Shift+D) mutates this live; when hidden the app just
   uses these defaults — my proposed "delightful" starting preset.
   ========================================================= */
const EASINGS = {
  Linear: "cubic-bezier(0,0,1,1)",
  Ease: "cubic-bezier(0.25,0.1,0.25,1)",
  "Ease-in-out": "cubic-bezier(0.42,0,0.58,1)",
  "Ease-out": "cubic-bezier(0,0,0.58,1)",
  "Back-out": "cubic-bezier(0.34,1.56,0.64,1)",
};
const DEFAULT_ANIM = {
  speed: 1,
  style: "spring",                                   // "spring" | "duration"
  spring: { stiffness: 240, damping: 21, mass: 1 },   // ζ≈0.68 → gentle overshoot
  duration: { ms: 300, easing: "cubic-bezier(0.34,1.56,0.64,1)" }, // Back-out
  press: { effect: "scale", scale: 0.94, duration: 130 }, // scale | scale-shadow | ripple | none
  stagger: { ms: 60, order: "body-first" },           // body-first | face-first
};
const clone = (o) => JSON.parse(JSON.stringify(o));

// Cubic-bezier(x1,y1,x2,y2) → easing function t∈[0,1]→[0,1] (Newton + bisection).
function makeBezier(str) {
  const m = /cubic-bezier\(([^)]+)\)/.exec(str);
  if (!m) return (t) => t;
  const [x1, y1, x2, y2] = m[1].split(",").map(Number);
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const fx = (t) => ((ax * t + bx) * t + cx) * t;
  const fy = (t) => ((ay * t + by) * t + cy) * t;
  const dfx = (t) => (3 * ax * t + 2 * bx) * t + cx;
  return (x) => {
    let t = x;
    for (let i = 0; i < 5; i++) { const e = fx(t) - x; const d = dfx(t); if (Math.abs(e) < 1e-4 || d === 0) break; t -= e / d; }
    let lo = 0, hi = 1;
    if (t < 0 || t > 1) { t = x; for (let i = 0; i < 20; i++) { const e = fx(t) - x; if (Math.abs(e) < 1e-4) break; e > 0 ? (hi = t) : (lo = t); t = (lo + hi) / 2; } }
    return fy(t);
  };
}

// Approx spring "visual duration" (ms) and a spring-like CSS easing, so the
// CSS-driven interactions (body swap, face crossfade) can mimic the spring.
function springTiming(sp) {
  const wn = Math.sqrt(sp.stiffness / sp.mass);
  const zeta = sp.damping / (2 * Math.sqrt(sp.stiffness * sp.mass));
  const ms = Math.max(120, Math.min(1400, (4 / (Math.max(0.2, zeta) * wn)) * 1000 * 0.6));
  const easing = zeta < 0.92 ? "cubic-bezier(0.34,1.4,0.5,1)" : "cubic-bezier(0.4,0,0.2,1)";
  return { ms, easing };
}
// Resolve the config into concrete { ms, easing } for CSS interactions.
function resolveTiming(cfg) {
  const speed = cfg.speed || 1;
  if (cfg.style === "duration") return { ms: cfg.duration.ms / speed, easing: cfg.duration.easing };
  const t = springTiming(cfg.spring);
  return { ms: t.ms / speed, easing: t.easing };
}

const AnimContext = React.createContext({ cfg: DEFAULT_ANIM, setCfg: () => {}, cfgRef: { current: DEFAULT_ANIM } });
const useAnim = () => React.useContext(AnimContext);

function hexToHsl(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255;
  const g = parseInt(hex.slice(3, 5), 16) / 255;
  const b = parseInt(hex.slice(5, 7), 16) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0, s = 0, l = (max + min) / 2;
  if (d !== 0) {
    s = d / (1 - Math.abs(2 * l - 1));
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h = h * 60; if (h < 0) h += 360;
  }
  return { h, s: s * 100, l: l * 100 };
}
const lerpHue = (a, b, t) => { const d = ((b - a + 540) % 360) - 180; return (a + d * t + 360) % 360; };
const hslStr = (h, s, l) => `hsl(${h.toFixed(1)}, ${s.toFixed(1)}%, ${l.toFixed(1)}%)`;

// Body color animation — reads the shared config at the moment `target` changes
// (so live panel edits apply to the next change). Spring or duration tween, HSL.
function useSpringColor(target) {
  const { cfgRef } = useAnim();
  const [color, setColor] = useState(target);
  const ref = useRef({ cur: hexToHsl(target), raf: 0 });
  useEffect(() => {
    const s = ref.current;
    const cfg = cfgRef.current;
    const from = s.cur, to = hexToHsl(target);
    const paint = (p) => {
      const c = { h: lerpHue(from.h, to.h, p), s: from.s + (to.s - from.s) * p, l: from.l + (to.l - from.l) * p };
      s.cur = c; setColor(hslStr(c.h, c.s, c.l));
    };
    const reduce = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) { paint(1); return; }
    cancelAnimationFrame(s.raf);
    const speed = cfg.speed || 1;
    if (cfg.style === "spring") {
      let p = 0, v = 0, last = 0; const sp = cfg.spring;
      const tick = (now) => {
        if (!last) last = now;
        let dt = Math.min((now - last) / 1000, 0.064) * speed; last = now;
        const steps = Math.max(1, Math.ceil(dt / (1 / 120))), h = dt / steps;
        for (let i = 0; i < steps; i++) { const a = (-sp.stiffness * (p - 1) - sp.damping * v) / sp.mass; v += a * h; p += v * h; }
        paint(Math.max(0, Math.min(1, p)));            // clamp → no muddy hue overshoot
        if (Math.abs(1 - p) < 0.001 && Math.abs(v) < 0.001) { paint(1); return; }
        s.raf = requestAnimationFrame(tick);
      };
      s.raf = requestAnimationFrame(tick);
    } else {
      const ms = Math.max(1, cfg.duration.ms / speed), ease = makeBezier(cfg.duration.easing);
      let start = 0;
      const tick = (now) => {
        if (!start) start = now;
        const t = Math.min(1, (now - start) / ms);
        paint(Math.max(0, Math.min(1, ease(t))));
        if (t < 1) s.raf = requestAnimationFrame(tick); else paint(1);
      };
      s.raf = requestAnimationFrame(tick);
    }
    return () => cancelAnimationFrame(s.raf);
  }, [target]);
  return color;
}

/* =========================================================
   <Eye /> — the ONE eye graphic (SVG <g>), reused by mascot + swatches.
   Ratios lifted from Figma so it is exact at any radius.
   ========================================================= */
let __eyeUid = 0;
function Eye({ cx, cy, r, eyelidColor, open = false }) {
  const uid = React.useMemo(() => `eye${__eyeUid++}`, []);
  // Eyelid height from Figma: sleepy/half = 60.25/118.42 of the eye; open = 12/118.42.
  const lidH = (open ? 0.2026 : 1.0176) * r;
  const pr = r * 0.342;
  const hlR = r * 0.1053;
  const pcy = cy + r * 0.08;
  return (
    <g>
      <clipPath id={uid}><circle cx={cx} cy={cy} r={r} /></clipPath>
      <circle cx={cx} cy={cy} r={r} fill={C.eyeWhite} />
      <g clipPath={`url(#${uid})`}>
        <circle cx={cx} cy={pcy} r={pr} fill={C.pupil} />
        <circle cx={cx + hlR * 0.9} cy={pcy - hlR * 0.27} r={hlR} fill="#ffffff" />
        <rect x={cx - r} y={cy - r} width={r * 2} height={lidH} fill={eyelidColor} />
      </g>
    </g>
  );
}

/* Face option = eye configuration on the character (from Figma node 704-7505):
   `eyes` = "two" (at ±55.8) or "one" (centered ~0.28); `open` = thin vs half lid. */
function EyeSet({ face, eyelidColor, r = 27.32, cy = 199.87 }) {
  const cxs = face.eyes === "two" ? [-55.7985, 56.3595] : [0.2805];
  return <g>{cxs.map((cx, i) => (
    <Eye key={i} cx={cx} cy={cy} r={r} eyelidColor={eyelidColor} open={face.open} />
  ))}</g>;
}

/* Crossfades the eyes when the Face option changes (a shape/count swap, so a
   color spring doesn't apply — see notes). Honors reduced motion. */
function Eyes({ face, eyelidColor }) {
  const { cfg } = useAnim();
  const timing = resolveTiming(cfg);
  const delay = cfg.stagger.order === "face-first" ? 0 : cfg.stagger.ms; // face waits if body-first
  const [cur, setCur] = useState(face);
  const [prev, setPrev] = useState(null);
  const [k, setK] = useState(0);
  const first = useRef(true);
  useEffect(() => {
    if (first.current) { first.current = false; return; }
    const reduce = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) { setCur(face); setPrev(null); return; }
    setPrev(cur);
    setCur(face);
    setK((x) => x + 1);
    const t = setTimeout(() => setPrev(null), timing.ms + delay + 60);
    return () => clearTimeout(t);
  }, [face]);
  const reduce = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const anim = (name) => reduce ? {} : ({
    animationName: name, animationDuration: `${timing.ms}ms`,
    animationTimingFunction: timing.easing, animationDelay: `${delay}ms`, animationFillMode: "both",
  });
  return (
    <g>
      {prev && <g style={anim("faceOut")} key={"out" + k}><EyeSet face={prev} eyelidColor={eyelidColor} /></g>}
      <g style={anim("faceIn")} key={"in" + k}><EyeSet face={cur} eyelidColor={eyelidColor} /></g>
    </g>
  );
}

/* =========================================================
   <SceneBackground /> — pale-blue field + curved white ground.
   ========================================================= */
function SceneBackground({ mobile = false }) {
  const groundStyle = mobile
    ? { position: "absolute", left: "-20%", width: "140%", bottom: 0, height: "34%" }
    : { position: "absolute", left: vw(-415), width: vw(2379.66), top: vw(783), height: vw(682.5) };
  return (
    <div className="absolute inset-0" style={{ background: C.bg }}>
      <svg viewBox="0 0 2379.66 682.5" preserveAspectRatio="none" aria-hidden="true" style={groundStyle}>
        <path d={GROUND_D} fill={C.ground} />
      </svg>
    </div>
  );
}

/* =========================================================
   <SidebarNav /> — vertical white pill; active tab is its own dark pill.
   ========================================================= */
function SidebarNav({ activeTab = "Shape", items = ["Shape", "Body", "Face", "Style"], onSelect = () => {} }) {
  return (
    <nav className="absolute z-30" style={{ top: vw(80), left: vw(80) }}>
      <div className="bg-white flex items-center justify-center overflow-hidden"
           style={{ width: vw(97), height: vw(350), padding: vw(12), borderRadius: vw(32) }}>
        <div className="flex flex-col items-center justify-between h-full" style={{ width: vw(72.5) }}>
          {items.map((label) => {
            const active = label === activeTab;
            return (
              <button key={label} onClick={() => onSelect(label)}
                className="w-full flex items-center justify-center focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400"
                style={{
                  height: vw(40), borderRadius: vw(20), padding: vw(16),
                  fontSize: `clamp(11px, ${vw(16)}, 18px)`, fontWeight: 500, lineHeight: "normal",
                  background: active ? C.navActive : "transparent",
                  color: active ? C.navActiveText : C.navText,
                  boxShadow: active ? "0 2px 3px rgba(0,0,0,0.25)" : "none",
                  cursor: "pointer", whiteSpace: "nowrap",
                }}>
                {label}
              </button>
            );
          })}
        </div>
      </div>
    </nav>
  );
}

               boxShadow: `0 2px 8px 0 ${C.arrowShadow}`, cursor: "pointer" }}>

}

/* ---------- Single body-option swatch (light circle w/ mini silhouette) ---------- */
function BodySwatch({ option, color, onSelect, selected }) {

/* ---------- Single face-option swatch (light-blue circle w/ mini eyes) ----------
   Preview background #B5CBE9 and eyelid #66686C are from the Figma face frames. */
function FaceSwatch({ option, onSelect, selected }) {

/* =========================================================
   <SwatchCarousel /> — arrows at row ends, options split around the character.
   Generalized: `renderItem(item, index, selected, onSelect)` lets the same
   carousel drive either color swatches (Shape) or body options (Body).
   ========================================================= */
function SwatchCarousel({ items, selectedIndex, onSelect, onPrev, onNext, renderItem }) {
  const half = Math.ceil(items.length / 2);
  const left = items.slice(0, half);
  const right = items.slice(half);
  const gap = vw(40);
  return (
    <div className="absolute z-20 left-1/2 flex items-center justify-between"
         style={{ top: vw(559), transform: "translate(-50%, -50%)", width: vw(1308) }}>
      <div className="flex items-center" style={{ gap }}>
        <ArrowButton dir="left" onClick={onPrev} />
        {left.map((it, i) => renderItem(it, i, selectedIndex === i, () => onSelect(i)))}
      </div>
      <div className="flex items-center" style={{ gap }}>
        {right.map((it, j) => { const i = half + j; return renderItem(it, i, selectedIndex === i, () => onSelect(i)); })}
        <ArrowButton dir="right" onClick={onNext} />
      </div>
    </div>
  );
}

/* =========================================================
   <MobileTabBar /> — horizontal white pill of tabs (active = dark pill),
   mirroring the desktop SidebarNav treatment. Scrolls if it can't fit.
   ========================================================= */
function MobileTabBar({ activeTab, items, onSelect }) {
  return (
    <nav style={{ position: "relative", zIndex: 30,
                  padding: "calc(env(safe-area-inset-top) + 0.75rem) 0.75rem 0.25rem" }}>
      <div className="hscroll" style={{
        display: "flex", gap: "0.25rem", alignItems: "center",
        background: "#fff", padding: "0.375rem", borderRadius: "9999px",
        boxShadow: "0 2px 8px rgba(0,0,0,0.08)", maxWidth: "26rem", margin: "0 auto",
        overflowX: "auto",
      }}>
        {items.map((label) => {
          const active = label === activeTab;
          return (
            <button key={label} onClick={() => onSelect(label)} aria-pressed={active}
              className="tappable focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400"
              style={{
                flex: "1 1 0", minWidth: "4.25rem", minHeight: "2.5rem",
                padding: "0.5rem 0.75rem", borderRadius: "9999px", border: "none",
                background: active ? C.navActive : "transparent",
                color: active ? C.navActiveText : C.navText,
                fontWeight: 500, fontSize: "0.95rem", whiteSpace: "nowrap", cursor: "pointer",
                boxShadow: active ? "0 2px 3px rgba(0,0,0,0.25)" : "none",
              }}>
              {label}
            </button>
          );
        })}
      </div>
    </nav>
  );
}

/* =========================================================
   <MobileCarousel /> — single swipeable scroll-snap row (tap to select),
   with the arrow buttons flanking it (step-cycle + auto-scroll into view).
   ========================================================= */
function MobileCarousel({ items, selectedIndex, onSelect, onPrev, onNext, renderItem }) {
  const scrollRef = useRef(null);
  useEffect(() => {
    const el = scrollRef.current && scrollRef.current.querySelector(`[data-idx="${selectedIndex}"]`);
    if (!el) return;
    const reduce = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
    el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", inline: "center", block: "nearest" });
  }, [selectedIndex, items]);
  return (
    <div style={{ position: "relative", zIndex: 20, display: "flex", alignItems: "center",
                  gap: "0.5rem", padding: "0.5rem 0.5rem calc(env(safe-area-inset-bottom) + 0.9rem)" }}>
      <ArrowButton dir="left" onClick={onPrev} />
      <div ref={scrollRef} className="hscroll" style={{
        flex: 1, display: "flex", gap: "0.85rem", overflowX: "auto",
        padding: "0.35rem 0.5rem", alignItems: "center",
      }}>
        {items.map((it, i) => (
          <div key={i} data-idx={i} className="snap" style={{ flex: "0 0 auto" }}>
            {renderItem(it, i, selectedIndex === i, () => onSelect(i))}
          </div>
        ))}
      </div>
      <ArrowButton dir="right" onClick={onNext} />
    </div>
  );
}

/* =========================================================
   App
   ========================================================= */
const SWATCHES = [
  { circleColor: "#9ec6fd", eyelidColor: "#5f7798" }, // cornflower blue
  { circleColor: "#a2acbd", eyelidColor: "#616771" }, // gray
  { circleColor: "#a98958", eyelidColor: "#655235" }, // brown
  { circleColor: "#e2be8a", eyelidColor: "#887253" }, // tan
];

// PLACEHOLDER body options — proportion transforms (scale about the feet) so the
// Body-tab interaction is fully functional now. Replace each entry with the real
// exported body SVG from Figma nodes 694-4887 / 698-7504 once the MCP is reachable.
const BODY_OPTIONS = [
  { sx: 1.00, sy: 1.00 },
  { sx: 0.85, sy: 1.00 },
  { sx: 1.00, sy: 0.90 },
  { sx: 0.80, sy: 0.92 },
];

// Face options (from Figma node 704-7505), in the frame's swatch-row order.
const FACE_OPTIONS = [
  { eyes: "two", open: false }, // two eyes, sleepy / half-lidded (default)
  { eyes: "two", open: true },  // two eyes, open
  { eyes: "one", open: true },  // one centered eye, open
  { eyes: "one", open: false }, // one centered eye, sleepy
];

/* =========================================================
   DEV TOOLING — Animation Controls. Everything below is gated behind
   ?debug=true (or Shift+D). Delete AnimProvider's press/ripple effects,
   DevPanel, and the Root gate to remove; the app then just uses DEFAULT_ANIM.
   ========================================================= */
function AnimProvider({ children }) {
  const [cfg, setCfg] = useState(DEFAULT_ANIM);
  const cfgRef = useRef(cfg);
  cfgRef.current = cfg;
  // Apply press-effect settings to <html> so CSS picks them up live.
  useEffect(() => {
    const el = document.documentElement;
    el.setAttribute("data-press", cfg.press.effect);
    el.style.setProperty("--press-scale", String(cfg.press.scale));
    el.style.setProperty("--press-dur", `${cfg.press.duration}ms`);
  }, [cfg.press.effect, cfg.press.scale, cfg.press.duration]);
  // Ripple press effect (only fires when effect === "ripple").
  useEffect(() => {
    const onDown = (e) => {
      if (cfgRef.current.press.effect !== "ripple") return;
      const btn = e.target.closest && e.target.closest(".tappable");
      if (!btn) return;
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height) * 2.2;
      const span = document.createElement("span");
      span.className = "press-ripple";
      span.style.width = span.style.height = `${size}px`;
      span.style.left = `${(e.clientX || rect.left + rect.width / 2) - rect.left}px`;
      span.style.top = `${(e.clientY || rect.top + rect.height / 2) - rect.top}px`;
      btn.appendChild(span);
      setTimeout(() => span.remove(), (cfgRef.current.press.duration || 400) + 80);
    };
    document.addEventListener("pointerdown", onDown, true);
    return () => document.removeEventListener("pointerdown", onDown, true);
  }, []);
  return <AnimContext.Provider value={{ cfg, setCfg, cfgRef }}>{children}</AnimContext.Provider>;
}

const DP = {
  row: { display: "flex", flexDirection: "column", gap: 4, marginBottom: 11 },
  head: { display: "flex", justifyContent: "space-between", alignItems: "baseline" },
  lbl: { fontSize: 11, opacity: 0.72, letterSpacing: "0.02em" },
  val: { fontSize: 11, fontFamily: "ui-monospace, Menlo, monospace", color: "#9ec6fd" },
  sel: { width: "100%", background: "#23262d", color: "#fff", border: "1px solid #3a3f49", borderRadius: 6, padding: "5px 6px", fontSize: 12 },
  num: { width: "100%", background: "#23262d", color: "#fff", border: "1px solid #3a3f49", borderRadius: 6, padding: "4px 5px", fontSize: 11, fontFamily: "monospace" },
  btn: { flex: 1, padding: "8px 10px", borderRadius: 8, border: "none", fontSize: 12, fontWeight: 600, cursor: "pointer" },
  section: { fontSize: 10, textTransform: "uppercase", letterSpacing: "0.08em", opacity: 0.5, margin: "14px 0 8px" },
};
function Row({ label, value, children }) {
  return (
    <div style={DP.row}>
      <div style={DP.head}><span style={DP.lbl}>{label}</span>{value != null && <span style={DP.val}>{value}</span>}</div>
      {children}
    </div>
  );
}
function Slider({ min, max, step, value, onChange, disabled }) {
  return <input type="range" min={min} max={max} step={step} value={value} disabled={disabled}
    onChange={(e) => onChange(parseFloat(e.target.value))}
    style={{ width: "100%", accentColor: "#9ec6fd", opacity: disabled ? 0.4 : 1 }} />;
}
function Sel({ value, options, onChange }) {
  return <select value={value} onChange={(e) => onChange(e.target.value)} style={DP.sel}>
    {options.map((o) => <option key={o} value={o}>{o}</option>)}
  </select>;
}

function DevPanel({ onClose }) {
  const { cfg, setCfg } = useAnim();
  const [collapsed, setCollapsed] = useState(false);
  const [copied, setCopied] = useState(false);
  const [showCode, setShowCode] = useState(false);
  const up = (patch) => setCfg((c) => ({ ...c, ...patch }));
  const upSpring = (p) => setCfg((c) => ({ ...c, spring: { ...c.spring, ...p } }));
  const upDur = (p) => setCfg((c) => ({ ...c, duration: { ...c.duration, ...p } }));
  const upPress = (p) => setCfg((c) => ({ ...c, press: { ...c.press, ...p } }));
  const upStag = (p) => setCfg((c) => ({ ...c, stagger: { ...c.stagger, ...p } }));

  const zeta = cfg.spring.damping / (2 * Math.sqrt(cfg.spring.stiffness * cfg.spring.mass));
  const springMs = Math.round(springTiming(cfg.spring).ms / cfg.speed);
  const easingName = Object.keys(EASINGS).find((k) => EASINGS[k] === cfg.duration.easing) || "Custom";
  const bez = ((/cubic-bezier\(([^)]+)\)/.exec(cfg.duration.easing) || [])[1] || "0.34,1.56,0.64,1").split(",").map(Number);
  const snippet = "const ANIM_CONFIG = " + JSON.stringify(cfg, null, 2) + ";";
  const copy = () => {
    try { navigator.clipboard && navigator.clipboard.writeText(snippet); } catch (e) {}
    setShowCode(true); setCopied(true); setTimeout(() => setCopied(false), 1300);
  };

  return (
    <div style={{
      position: "fixed", right: 16, bottom: 16, zIndex: 9999, width: 296, maxWidth: "calc(100vw - 24px)",
      maxHeight: "86vh", overflowY: "auto", background: "#15171c", color: "#f4f4f5",
      borderRadius: 14, boxShadow: "0 12px 40px rgba(0,0,0,0.4)", border: "1px solid #2a2e37",
      fontFamily: "'Manrope', system-ui, sans-serif",
    }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between",
                    padding: "12px 14px", position: "sticky", top: 0, background: "#15171c", borderBottom: "1px solid #2a2e37" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ width: 8, height: 8, borderRadius: 9999, background: "#9ec6fd", display: "inline-block" }} />
          <strong style={{ fontSize: 13 }}>Animation Controls</strong>
        </div>
        <div style={{ display: "flex", gap: 6 }}>
          <button onClick={() => setCollapsed((v) => !v)} title="Collapse"
            style={{ ...DP.btn, flex: "none", padding: "3px 9px", background: "#23262d", color: "#fff" }}>{collapsed ? "▸" : "▾"}</button>
          <button onClick={onClose} title="Hide (Shift+D)"
            style={{ ...DP.btn, flex: "none", padding: "3px 9px", background: "#23262d", color: "#fff" }}>✕</button>
        </div>
      </div>

      {!collapsed && (
        <div style={{ padding: "12px 14px 16px" }}>
          <Row label="Animation speed" value={`${cfg.speed.toFixed(2)}×`}>
            <Slider min={0.25} max={3} step={0.05} value={cfg.speed} onChange={(v) => up({ speed: v })} />
          </Row>

          <div style={DP.section}>Model</div>
          <Row label="Animation style">
            <Sel value={cfg.style} options={["spring", "duration"]} onChange={(v) => up({ style: v })} />
          </Row>
          {cfg.style === "spring" ? (
            <React.Fragment>
              <Row label="Stiffness" value={cfg.spring.stiffness}>
                <Slider min={20} max={600} step={5} value={cfg.spring.stiffness} onChange={(v) => upSpring({ stiffness: v })} />
              </Row>
              <Row label="Damping" value={cfg.spring.damping}>
                <Slider min={2} max={60} step={1} value={cfg.spring.damping} onChange={(v) => upSpring({ damping: v })} />
              </Row>
              <Row label="Mass" value={cfg.spring.mass.toFixed(2)}>
                <Slider min={0.2} max={4} step={0.1} value={cfg.spring.mass} onChange={(v) => upSpring({ mass: v })} />
              </Row>
              <div style={{ ...DP.val, opacity: 0.6, marginTop: -4 }}>
                ζ={zeta.toFixed(2)} {zeta < 1 ? "(bouncy)" : "(no overshoot)"} · ~{springMs}ms
              </div>
            </React.Fragment>
          ) : (
            <React.Fragment>
              <Row label="Duration" value={`${cfg.duration.ms}ms`}>
                <Slider min={60} max={1200} step={10} value={cfg.duration.ms} onChange={(v) => upDur({ ms: v })} />
              </Row>
              <Row label="Easing curve" value={easingName}>
                <Sel value={easingName} options={[...Object.keys(EASINGS), "Custom"]}
                  onChange={(v) => { if (v !== "Custom") upDur({ easing: EASINGS[v] }); else upDur({ easing: `cubic-bezier(${bez.join(",")})` }); }} />
              </Row>
              {easingName === "Custom" && (
                <div style={{ display: "flex", gap: 4, marginBottom: 11 }}>
                  {bez.map((n, i) => (
                    <input key={i} type="number" step="0.01" value={n} style={DP.num}
                      onChange={(e) => { const nb = bez.slice(); nb[i] = parseFloat(e.target.value) || 0; upDur({ easing: `cubic-bezier(${nb.join(",")})` }); }} />
                  ))}
                </div>
              )}
            </React.Fragment>
          )}

          <div style={DP.section}>Button press</div>
          <Row label="Press effect">
            <Sel value={cfg.press.effect} options={["scale", "scale-shadow", "ripple", "none"]} onChange={(v) => upPress({ effect: v })} />
          </Row>
          <Row label="Press scale" value={cfg.press.scale.toFixed(2)}>
            <Slider min={0.85} max={1} step={0.01} value={cfg.press.scale} disabled={cfg.press.effect === "none"} onChange={(v) => upPress({ scale: v })} />
          </Row>
          <Row label="Press duration" value={`${cfg.press.duration}ms`}>
            <Slider min={40} max={600} step={10} value={cfg.press.duration} onChange={(v) => upPress({ duration: v })} />
          </Row>

          <div style={DP.section}>Stagger</div>
          <Row label="Body ↔ face delay" value={`${cfg.stagger.ms}ms`}>
            <Slider min={0} max={400} step={10} value={cfg.stagger.ms} onChange={(v) => upStag({ ms: v })} />
          </Row>
          <Row label="Stagger order">
            <Sel value={cfg.stagger.order} options={["body-first", "face-first"]} onChange={(v) => upStag({ order: v })} />
          </Row>

          <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
            <button onClick={() => setCfg(clone(DEFAULT_ANIM))} style={{ ...DP.btn, background: "#23262d", color: "#fff" }}>Reset</button>
            <button onClick={copy} style={{ ...DP.btn, background: "#9ec6fd", color: "#15171c" }}>{copied ? "Copied ✓" : "Copy config"}</button>
          </div>
          {showCode && (
            <textarea readOnly value={snippet} onFocus={(e) => e.target.select()}
              style={{ width: "100%", height: 150, marginTop: 10, background: "#0f1114", color: "#cbd5e1",
                       border: "1px solid #2a2e37", borderRadius: 8, padding: 8, fontSize: 10.5,
                       fontFamily: "ui-monospace, Menlo, monospace", resize: "vertical" }} />
          )}
        </div>
      )}
    </div>
  );
}

function App() {
  const [activeTab, setActiveTab] = useState("Shape");
  // One selectedIndex per tab, so switching tabs preserves each selection.
  const [colorIndex, setColorIndex] = useState(0);
  const [bodyIndex, setBodyIndex] = useState(0);
  const [faceIndex, setFaceIndex] = useState(0);

  const color = SWATCHES[colorIndex];
  const bodyOpt = BODY_OPTIONS[bodyIndex];
  const faceOpt = FACE_OPTIONS[faceIndex];

  // The carousel shows the active tab's options; each tab keeps its own index.
  const bodyMode = activeTab === "Body";
  const faceMode = activeTab === "Face";
  const items = faceMode ? FACE_OPTIONS : bodyMode ? BODY_OPTIONS : SWATCHES;
  const index = faceMode ? faceIndex : bodyMode ? bodyIndex : colorIndex;
  const setIndex = faceMode ? setFaceIndex : bodyMode ? setBodyIndex : setColorIndex;
  const len = items.length;
  const selectAt = (i) => setIndex(((i % len) + len) % len);
  const prev = () => setIndex((i) => (i - 1 + len) % len);
  const next = () => setIndex((i) => (i + 1) % len);

  // Same interaction/state pattern for every mode; only the item renderer differs.
  const renderItem = faceMode
    ? (opt, i, sel, onSel) => <FaceSwatch key={i} option={opt} selected={sel} onSelect={onSel} />
    : bodyMode
    ? (opt, i, sel, onSel) => <BodySwatch key={i} option={opt} color={color.circleColor} selected={sel} onSelect={onSel} />
    : (sw, i, sel, onSel) => <Swatch key={i} {...sw} selected={sel} onSelect={onSel} />;

  const showCarousel = activeTab === "Shape" || activeTab === "Body" || activeTab === "Face";
  const isDesktop = useMediaQuery("(min-width: 1024px)");
  const tabs = ["Shape", "Body", "Face", "Style"];

  return (
    <div className="relative w-full overflow-hidden" style={{ height: "100dvh", minHeight: "100%" }}>
      <SceneBackground mobile={!isDesktop} />

      {isDesktop ? (
        <React.Fragment>
          <SidebarNav activeTab={activeTab} onSelect={setActiveTab} />
          <div className="absolute z-10 left-1/2"
               style={{ top: vw(96), transform: "translateX(-50%)", height: vw(925) }}>
            <CharacterMascot bodyColor={color.circleColor} eyelidColor={color.eyelidColor} bodyOption={bodyOpt} faceOption={faceOpt}
                             style={{ height: "100%", width: "auto", display: "block" }} />
          </div>
          {showCarousel && (
            <SwatchCarousel items={items} selectedIndex={index}
                            onSelect={selectAt} onPrev={prev} onNext={next} renderItem={renderItem} />
          )}
        </React.Fragment>
      ) : (
        <div className="absolute inset-0 flex flex-col">
          <MobileTabBar activeTab={activeTab} items={tabs} onSelect={setActiveTab} />
          <div className="flex-1 flex items-center justify-center"
               style={{ minHeight: 0, padding: "0.5rem 1rem" }}>
            <CharacterMascot bodyColor={color.circleColor} eyelidColor={color.eyelidColor} bodyOption={bodyOpt} faceOption={faceOpt}
                             style={{ width: "100%", height: "100%", display: "block" }} />
          </div>
          {showCarousel && (
            <MobileCarousel items={items} selectedIndex={index}
                            onSelect={selectAt} onPrev={prev} onNext={next} renderItem={renderItem} />
          )}
        </div>
      )}
    </div>
  );
}

/* Gate: DevPanel shows only with ?debug=true or after pressing Shift+D.
   When hidden the app just runs on DEFAULT_ANIM — no panel, no overhead. */
function Root() {
  const [debug, setDebug] = useState(() => {
    try { return new URLSearchParams(location.search).has("debug"); } catch (e) { return false; }
  });
  useEffect(() => {
    const h = (e) => {
      if (e.shiftKey && (e.key === "D" || e.key === "d")) { e.preventDefault(); setDebug((d) => !d); }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, []);
  return (
    <AnimProvider>
      <App />
      {debug && <DevPanel onClose={() => setDebug(false)} />}
    </AnimProvider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
