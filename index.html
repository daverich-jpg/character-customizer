const { useState, useEffect, useRef } = React;

/* The Figma frame (node 671:2181) is a fixed 1728px-wide canvas.
   Everything is sized/positioned in vw relative to that canvas, so the
   whole scene scales uniformly with the viewport width — exact Figma
   proportions at any size, with no fixed-px/percentage collisions. */

const vw = (px) => `${(px * K).toFixed(3)}vw`;

  navActive: "#190f13",
  navActiveText: "#fafafa",
  navText: "#190f13",

const MOUTH_D = "M15.854 16.5056C33.9658 2.47975 68.81 16.0756 84.1988 23.247C89.0153 25.4916 94.6271 25.4699 99.4084 23.1516C116.839 14.7 159.632 -3.03633 177.62 16.5056C205.707 47.0203 137.369 84.7509 95.8981 84.3274C54.9289 83.909 -16.5396 41.5914 15.854 16.5056Z";

const TORSO_D = "M215.541 0H114.026C52.4416 0 1.98468 48.9007 0.0559501 110.455C-0.622668 132.113 4.88375 153.515 15.9303 172.157L34.2316 203.04C49.2642 228.408 56.2884 257.723 54.3852 287.148L52.8266 311.244C49.7958 358.102 76.3455 401.867 119.304 420.825C148.395 433.664 181.574 433.518 210.551 420.424L212.612 419.493C253.519 401.008 280.235 360.74 281.366 315.865L282.207 282.47C282.878 255.848 289.788 229.755 302.381 206.291L319.674 174.067C330.346 154.182 335.101 131.658 333.378 109.156C328.66 47.5673 277.31 0 215.541 0Z";
const ARM_L_D = "M1.10063 268.989C8.95341 145.107 170.512 38.1176 255 0V87.0642C224.462 93.9947 161.206 132.112 107.547 253.829C84.039 307.152 131.06 355.236 149.925 396.192C157.809 413.31 151.119 432.189 139.738 447.211C127.933 462.791 111.197 473.909 92.2597 478.753L83.6843 480.946C70.6167 484.288 56.3656 484.908 47.124 475.083C23.8275 450.317 -6.13776 383.179 1.10063 268.989Z";
const ARM_R_D = "M704.899 268.989C697.047 145.107 535.488 38.1176 451 0V87.0642C481.538 93.9947 544.794 132.112 598.453 253.829C621.961 307.152 574.94 355.236 556.075 396.192C548.191 413.31 554.881 432.189 566.262 447.211C578.067 462.791 594.803 473.909 613.74 478.753L622.316 480.946C635.383 484.288 649.634 484.908 658.876 475.083C682.173 450.317 712.138 383.179 704.899 268.989Z";
const GROUND_D = "M1179 0C875 0 369.667 85.3333 155 128L0 473.5L675 682.5L2373.5 473.5C2387.67 375.167 2386.5 168.4 2268.5 128C2121 77.5 1559 0 1179 0Z";

/* =========================================================
   Spring-animated body color.
   Real spring physics (same model Framer Motion uses: stiffness/damping/mass),
   interpolated in HSL so the in-between blend stays vivid rather than muddy.
   Progress is clamped to [0,1] so a hue can't visibly overshoot the target.
   ========================================================= */
// Tuned from the spec's {120,18,1} start to land the visual arrival near 240ms
// with effectively no overshoot (damping ratio ~0.87).
const SPRING = { stiffness: 260, damping: 28, mass: 1 };

function hexToHsl(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255;
  const g = parseInt(hex.slice(3, 5), 16) / 255;
  const b = parseInt(hex.slice(5, 7), 16) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0, s = 0, l = (max + min) / 2;
  if (d !== 0) {
    s = d / (1 - Math.abs(2 * l - 1));
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h = h * 60; if (h < 0) h += 360;
  }
  return { h, s: s * 100, l: l * 100 };
}
const lerpHue = (a, b, t) => { const d = ((b - a + 540) % 360) - 180; return (a + d * t + 360) % 360; };
const hslStr = (h, s, l) => `hsl(${h.toFixed(1)}, ${s.toFixed(1)}%, ${l.toFixed(1)}%)`;

function useSpringColor(target, cfg = SPRING) {
  const [color, setColor] = useState(target);
  const ref = useRef({ cur: hexToHsl(target), from: hexToHsl(target), to: hexToHsl(target), p: 1, v: 0, raf: 0, last: 0 });
  useEffect(() => {
    const s = ref.current;
    const reduce = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
    s.from = s.cur;                // begin from the currently displayed color
    s.to = hexToHsl(target);
    s.p = 0; s.v = 0; s.last = 0;
    if (reduce) { s.cur = s.to; s.p = 1; setColor(hslStr(s.to.h, s.to.s, s.to.l)); return; }
    cancelAnimationFrame(s.raf);
    const tick = (now) => {
      if (!s.last) s.last = now;
      let dt = (now - s.last) / 1000; s.last = now;
      dt = Math.min(dt, 0.064);
      const steps = Math.max(1, Math.ceil(dt / (1 / 120))), h = dt / steps;
      for (let i = 0; i < steps; i++) {
        const a = (-cfg.stiffness * (s.p - 1) - cfg.damping * s.v) / cfg.mass;
        s.v += a * h; s.p += s.v * h;
      }
      const p = Math.max(0, Math.min(1, s.p)); // clamp → no hue overshoot
      s.cur = { h: lerpHue(s.from.h, s.to.h, p), s: s.from.s + (s.to.s - s.from.s) * p, l: s.from.l + (s.to.l - s.from.l) * p };
      setColor(hslStr(s.cur.h, s.cur.s, s.cur.l));
      if (Math.abs(1 - s.p) < 0.001 && Math.abs(s.v) < 0.001) { s.p = 1; s.v = 0; s.cur = s.to; setColor(hslStr(s.to.h, s.to.s, s.to.l)); return; }
      s.raf = requestAnimationFrame(tick);
    };
    s.raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(s.raf);
  }, [target, cfg.stiffness, cfg.damping, cfg.mass]);
  return color;
}

/* =========================================================
   <Eye /> — the ONE eye graphic (SVG <g>), reused by mascot + swatches.
   Ratios lifted from Figma so it is exact at any radius.
   ========================================================= */
let __eyeUid = 0;
function Eye({ cx, cy, r, eyelidColor }) {
  const uid = React.useMemo(() => `eye${__eyeUid++}`, []);
  const lidH = r * 1.0176;
  const pr = r * 0.342;
  const hlR = r * 0.1053;
  const pcy = cy + r * 0.08;
  return (
    <g>
      <clipPath id={uid}><circle cx={cx} cy={cy} r={r} /></clipPath>
      <circle cx={cx} cy={cy} r={r} fill={C.eyeWhite} />
      <g clipPath={`url(#${uid})`}>
        <circle cx={cx} cy={pcy} r={pr} fill={C.pupil} />
        <circle cx={cx + hlR * 0.9} cy={pcy - hlR * 0.27} r={hlR} fill="#ffffff" />
        <rect x={cx - r} y={cy - r} width={r * 2} height={lidH} fill={eyelidColor} />
      </g>
    </g>
  );
}

/* =========================================================
   <CharacterMascot /> — full creature as one SVG (viewBox 420.534 x 925).
   ========================================================= */
function CharacterMascot({ bodyColor = C.body, eyelidColor = C.eyelid, bodyOption = BODY_OPTIONS[0], style }) {
  // Spring-animate the body color toward the target `bodyColor` (eyelids stay instant).
  const body = useSpringColor(bodyColor);
  // Body option = a proportion transform anchored at the feet (0, 1094) so the
  // character stays planted on the ground. PLACEHOLDER scales until the real body
  // shapes are exported from Figma (nodes 694-4887 / 698-7504).
  const bt = `translate(0 1094) scale(${bodyOption.sx} ${bodyOption.sy}) translate(0 -1094)`;
  // feet, in the new character's coordinate space (right foot toe →, left toe ←)
  const feet = [
    { legX: 26.1, sockX: 26.1, shoeX: 26.1 },        // right
    { legX: -89.87, sockX: -89.87, shoeX: -188.43 }, // left
  ];
  return (
    <svg viewBox="-353.8755 0 706 1107.437" style={style} xmlns="http://www.w3.org/2000/svg"
         role="img" aria-label="Character preview">
      <defs>
        <filter id="shadowBlur" x="-20%" y="-60%" width="140%" height="220%">
          <feGaussianBlur stdDeviation="5" />
        </filter>
      </defs>

      <g transform={bt}>
      {/* head / ears */}
      <g transform="translate(-119.8755, 0)"><path d={HEAD_D} fill={body} /></g>

      {/* arms (behind the torso) */}
      <g transform="translate(-353.8755, 394)">
        <path d={ARM_L_D} fill={body} />
        <path d={ARM_R_D} fill={body} />
      </g>

      {/* torso */}
      <g transform="translate(-167.523, 383.997)"><path d={TORSO_D} fill={body} /></g>

      {/* ground shadow */}
      <ellipse cx="0" cy="1081.937" rx="203" ry="25.5" fill={C.shadow} filter="url(#shadowBlur)" />

      {/* legs + socks + shoes */}
      {feet.map((l, i) => (
        <g key={i}>
          <rect x={l.legX} y="738.927" width="54.641" height="278.956" rx="19.172" fill={body} />
          <rect x={l.sockX} y="935.377" width="54.641" height="82.508" fill={C.sock} />
          <rect x={l.shoeX} y="992.887" width="153.183" height="101.545" rx="38.344" fill={C.shoe} />
        </g>
      ))}

      {/* face — eyes (same style/component as before) */}
      <Eye cx={-55.7985} cy={199.87} r={27.32} eyelidColor={eyelidColor} />
      <Eye cx={56.3595} cy={199.87} r={27.32} eyelidColor={eyelidColor} />

      {/* face — mouth (unchanged) */}
      <g transform="translate(-95.887, 219.524)">
        <path d={MOUTH_D} fill={C.mouthFill} stroke={C.lipRing} strokeWidth="15.3378" />
      </g>
      <rect x="-41.2555" y="238.211" width="27.8" height="23.965" rx="2.876" fill={C.eyeWhite} />
      <rect x="5.7345" y="238.211" width="27.8" height="23.965" rx="2.876" fill={C.eyeWhite} />
      <g transform="translate(-95.887, 219.524)">
        <path d={MOUTH_D} fill="none" stroke={eyelidColor} strokeWidth="15.3378" />
      </g>
      </g>
    </svg>
  );
}

/* =========================================================
   <SceneBackground /> — pale-blue field + curved white ground.
   ========================================================= */
function SceneBackground() {
  return (
    <div className="absolute inset-0" style={{ background: C.bg }}>
      <svg viewBox="0 0 2379.66 682.5" preserveAspectRatio="none" aria-hidden="true"
           style={{ position: "absolute", left: vw(-415), width: vw(2379.66), top: vw(783), height: vw(682.5) }}>
        <path d={GROUND_D} fill={C.ground} />
      </svg>
    </div>
  );
}

/* =========================================================
   <SidebarNav /> — vertical white pill; active tab is its own dark pill.
   ========================================================= */
function SidebarNav({ activeTab = "Shape", items = ["Shape", "Body", "Face", "Style"], onSelect = () => {} }) {
  return (
    <nav className="absolute z-30" style={{ top: vw(80), left: vw(80) }}>
      <div className="bg-white flex items-center justify-center overflow-hidden"
           style={{ width: vw(97), height: vw(350), padding: vw(12), borderRadius: vw(32) }}>
        <div className="flex flex-col items-center justify-between h-full" style={{ width: vw(72.5) }}>
          {items.map((label) => {
            const active = label === activeTab;
            return (
              <button key={label} onClick={() => onSelect(label)}
                className="w-full flex items-center justify-center focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400"
                style={{
                  height: vw(40), borderRadius: vw(20), padding: vw(16),
                  fontSize: `clamp(11px, ${vw(16)}, 18px)`, fontWeight: 500, lineHeight: "normal",
                  background: active ? C.navActive : "transparent",
                  color: active ? C.navActiveText : C.navText,
                  boxShadow: active ? "0 2px 3px rgba(0,0,0,0.25)" : "none",
                  cursor: "pointer", whiteSpace: "nowrap",
                }}>
                {label}
              </button>
            );
          })}
        </div>
      </div>
    </nav>
  );
}

/* ---------- Arrow button (white rounded square, chevron from Figma) ---------- */
function ArrowButton({ dir = "left", onClick }) {
  return (
    <button onClick={onClick} aria-label={dir === "left" ? "Previous" : "Next"}
      className="shrink-0 bg-white flex items-center justify-center focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400"
      style={{ width: vw(40), height: vw(40), borderRadius: vw(20),
               boxShadow: `0 ${vw(2)} ${vw(8)} 0 ${C.arrowShadow}`, cursor: "pointer" }}>
      <svg width="60%" height="60%" viewBox="0 0 24 24" fill="none" aria-hidden="true"
           style={{ transform: dir === "right" ? "rotate(180deg)" : "none" }}>
        <path d="M15 6C15 6 9.00001 10.4189 9 12C8.99999 13.5812 15 18 15 18"
              stroke="#000000" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
      </svg>
    </button>
  );
}

/* ---------- Single swatch (140px circle with the shared Eye pair) ---------- */
function Swatch({ circleColor, eyelidColor, onSelect, selected }) {
  return (
    <button onClick={onSelect}
      className="shrink-0 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400"
      style={{
        width: vw(140), height: vw(140), borderRadius: "9999px", padding: 0, border: "none",
        background: "transparent", cursor: "pointer",
        boxShadow: selected ? `0 0 0 ${vw(4)} ${C.navActive}` : "none",
      }}>
      <svg viewBox="0 0 140 140" className="w-full h-full block" aria-hidden="true">
        <circle cx="70" cy="70" r="70" fill={circleColor} />
      </svg>
    </button>
  );
}

/* ---------- Body-option thumbnail: mini silhouette of the character body ---------- */
function BodyGlyph({ option, color }) {
  const t = `translate(0 1094) scale(${option.sx} ${option.sy}) translate(0 -1094)`;
  return (
    <g transform={t} fill={color}>
      <g transform="translate(-119.8755, 0)"><path d={HEAD_D} /></g>
      <g transform="translate(-353.8755, 394)"><path d={ARM_L_D} /><path d={ARM_R_D} /></g>
      <g transform="translate(-167.523, 383.997)"><path d={TORSO_D} /></g>
      <rect x="26.1" y="738.927" width="54.641" height="278.956" rx="19.172" />
      <rect x="-89.87" y="738.927" width="54.641" height="278.956" rx="19.172" />
    </g>
  );
}

/* ---------- Single body-option swatch (light circle w/ mini silhouette) ---------- */
function BodySwatch({ option, color, onSelect, selected }) {
  return (
    <button onClick={onSelect}
      className="shrink-0 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400"
      style={{
        width: vw(140), height: vw(140), borderRadius: "9999px", padding: 0, border: "none",
        background: "transparent", cursor: "pointer",
        boxShadow: selected ? `0 0 0 ${vw(4)} ${C.navActive}` : "none",
      }}>
      <svg viewBox="0 0 140 140" className="w-full h-full block" aria-hidden="true">
        <circle cx="70" cy="70" r="70" fill={C.eyeWhite} />
        <svg x="20" y="14" width="100" height="112" viewBox="-353.8755 0 706 1107.437"
             preserveAspectRatio="xMidYMid meet">
          <BodyGlyph option={option} color={color} />
        </svg>
      </svg>
    </button>
  );
}

/* =========================================================
   <SwatchCarousel /> — arrows at row ends, options split around the character.
   Generalized: `renderItem(item, index, selected, onSelect)` lets the same
   carousel drive either color swatches (Shape) or body options (Body).
   ========================================================= */
function SwatchCarousel({ items, selectedIndex, onSelect, onPrev, onNext, renderItem }) {
  const half = Math.ceil(items.length / 2);
  const left = items.slice(0, half);
  const right = items.slice(half);
  const gap = vw(40);
  return (
    <div className="absolute z-20 left-1/2 flex items-center justify-between"
         style={{ top: vw(559), transform: "translate(-50%, -50%)", width: vw(1308) }}>
      <div className="flex items-center" style={{ gap }}>
        <ArrowButton dir="left" onClick={onPrev} />
        {left.map((it, i) => renderItem(it, i, selectedIndex === i, () => onSelect(i)))}
      </div>
      <div className="flex items-center" style={{ gap }}>
        {right.map((it, j) => { const i = half + j; return renderItem(it, i, selectedIndex === i, () => onSelect(i)); })}
        <ArrowButton dir="right" onClick={onNext} />
      </div>
    </div>
  );
}

/* =========================================================
   App
   ========================================================= */
const SWATCHES = [
  { circleColor: "#9ec6fd", eyelidColor: "#5f7798" }, // cornflower blue
  { circleColor: "#a2acbd", eyelidColor: "#616771" }, // gray
  { circleColor: "#a98958", eyelidColor: "#655235" }, // brown
  { circleColor: "#e2be8a", eyelidColor: "#887253" }, // tan
];

// PLACEHOLDER body options — proportion transforms (scale about the feet) so the
// Body-tab interaction is fully functional now. Replace each entry with the real
// exported body SVG from Figma nodes 694-4887 / 698-7504 once the MCP is reachable.
const BODY_OPTIONS = [
  { sx: 1.00, sy: 1.00 },
  { sx: 0.85, sy: 1.00 },
  { sx: 1.00, sy: 0.90 },
  { sx: 0.80, sy: 0.92 },
];

function App() {
  const [activeTab, setActiveTab] = useState("Shape");
  // One selectedIndex per tab, so switching tabs preserves each selection.
  const [colorIndex, setColorIndex] = useState(0);
  const [bodyIndex, setBodyIndex] = useState(0);

  const color = SWATCHES[colorIndex];
  const bodyOpt = BODY_OPTIONS[bodyIndex];

  // The carousel shows body options on the "Body" tab, color options otherwise.
  const bodyMode = activeTab === "Body";
  const items = bodyMode ? BODY_OPTIONS : SWATCHES;
  const index = bodyMode ? bodyIndex : colorIndex;
  const setIndex = bodyMode ? setBodyIndex : setColorIndex;
  const len = items.length;
  const selectAt = (i) => setIndex(((i % len) + len) % len);
  const prev = () => setIndex((i) => (i - 1 + len) % len);
  const next = () => setIndex((i) => (i + 1) % len);

  // Same interaction/state pattern for both modes; only the item renderer differs.
  const renderItem = bodyMode
    ? (opt, i, sel, onSel) => <BodySwatch key={i} option={opt} color={color.circleColor} selected={sel} onSelect={onSel} />
    : (sw, i, sel, onSel) => <Swatch key={i} {...sw} selected={sel} onSelect={onSel} />;

  const showCarousel = activeTab === "Shape" || activeTab === "Body";

  return (
    <div className="relative w-full h-full overflow-hidden">
      <SceneBackground />
      <SidebarNav activeTab={activeTab} onSelect={setActiveTab} />

      <div className="absolute z-10 left-1/2"
           style={{ top: vw(96), transform: "translateX(-50%)", height: vw(925) }}>
        <CharacterMascot bodyColor={color.circleColor} eyelidColor={color.eyelidColor} bodyOption={bodyOpt}
                         style={{ height: "100%", width: "auto", display: "block" }} />
      </div>

      {showCarousel && (
        <SwatchCarousel items={items} selectedIndex={index}
                        onSelect={selectAt} onPrev={prev} onNext={next} renderItem={renderItem} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
